[pytest]
; Makes the repo root importable as `src.*` regardless of the current
; working directory pytest is invoked from. Without this, `from
; src.collect_data import ...` (and similar imports across tests/)
; failed outright in GitHub Actions CI with "ModuleNotFoundError: No
; module named 'src'" even though it worked locally. This is pytest's
; own supported pythonpath option, so it fixes the import the same way
; for CI, a fresh clone, and any contributor's machine -- not a
; CI-specific workaround.
pythonpath = .
